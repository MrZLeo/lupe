name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag matches the project version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: release tag must be a stable semantic version (vX.Y.Z)" >&2
            exit 1
          fi

          project_version="$(
            awk '$1 == "VERSION" { print $2; exit }' CMakeLists.txt
          )"
          if [[ "$RELEASE_TAG" != "v${project_version}" ]]; then
            echo "error: tag ${RELEASE_TAG} does not match project version v${project_version}" >&2
            exit 1
          fi

  linux:
    name: Linux x86_64
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: linux-glibc-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'test/**') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            binutils \
            cmake \
            file \
            g++ \
            git \
            libc6-dev \
            ninja-build \
            patch

      - name: Build
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS=-static \
            -DLupe_ENABLE_LTO=ON \
            -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE" \
            -DLupe_ENABLE_UNIT_TESTING=ON
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify and package
        run: |
          set -euo pipefail

          binary=build/bin/Release/lupe
          strip --strip-unneeded "$binary"
          file "$binary"
          if readelf -l "$binary" | grep -q "INTERP"; then
            echo "error: Linux release contains a dynamic interpreter" >&2
            exit 1
          fi
          if readelf -d "$binary" | grep -q "NEEDED"; then
            echo "error: Linux release contains dynamic dependencies" >&2
            exit 1
          fi
          "$binary" --version

          archive="lupe-${RELEASE_VERSION}-linux-x86_64.tar.gz"
          mkdir -p dist package
          install -m 0755 "$binary" package/lupe
          install -m 0644 LICENSE package/LICENSE
          install -m 0644 THIRD_PARTY_LICENSES.md package/THIRD_PARTY_LICENSES.md
          tar -C package -czf "dist/${archive}" \
            lupe LICENSE THIRD_PARTY_LICENSES.md

          extracted="$(mktemp -d)"
          tar -C "$extracted" -xzf "dist/${archive}"
          test -f "$extracted/LICENSE"
          test -f "$extracted/THIRD_PARTY_LICENSES.md"
          "$extracted/lupe" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lupe-${{ env.RELEASE_VERSION }}-linux-x86_64
          path: dist/lupe-${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: validate
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: windows-msvc-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'test/**') }}

      - name: Set up MSVC toolchain
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --yes --no-progress

      - name: Configure
        shell: pwsh
        # No Lupe_ENABLE_LTO here: MSVC /GL performs whole-program ODR
        # checks and currently fails (LNK1000/C1001) because first-party
        # targets define _HAS_EXCEPTIONS=0 while FTXUI does not. Re-enable
        # after unifying exception flags across dependencies.
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCPM_SOURCE_CACHE="$env:CPM_SOURCE_CACHE" `
            -DLupe_ENABLE_UNIT_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify and package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binaryCandidates = @(
            Get-ChildItem "build/bin" -Recurse -Filter "lupe.exe" -File
          )
          if ($binaryCandidates.Count -ne 1) {
            throw "Expected one lupe.exe, found $($binaryCandidates.Count)"
          }
          $binary = $binaryCandidates[0].FullName
          Write-Host "Using release binary: $binary"

          & $binary --version

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $dumpbin = Get-ChildItem `
            "$installPath/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe was not found"
          }

          $dumpbinPath = $dumpbin.FullName
          $dependencies = & $dumpbinPath /dependents $binary
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin.exe failed with exit code $LASTEXITCODE"
          }
          $dependencies
          if (
            $dependencies -match
            "(?i)(vcruntime|msvcp|ucrtbase|api-ms-win-crt).*\.dll"
          ) {
            throw "Windows release depends on a dynamic MSVC runtime"
          }

          $archive = "lupe-$env:RELEASE_VERSION-windows-x86_64.zip"
          New-Item -ItemType Directory -Force dist, package | Out-Null
          Copy-Item $binary package/lupe.exe
          Copy-Item LICENSE package/LICENSE
          Copy-Item THIRD_PARTY_LICENSES.md package/THIRD_PARTY_LICENSES.md
          Compress-Archive `
            -Path package/lupe.exe, package/LICENSE, package/THIRD_PARTY_LICENSES.md `
            -DestinationPath "dist/$archive"

          $extracted = Join-Path $env:RUNNER_TEMP "lupe-release-check"
          Expand-Archive -Path "dist/$archive" -DestinationPath $extracted
          if (-not (Test-Path "$extracted/LICENSE")) {
            throw "Release archive is missing LICENSE"
          }
          if (-not (Test-Path "$extracted/THIRD_PARTY_LICENSES.md")) {
            throw "Release archive is missing THIRD_PARTY_LICENSES.md"
          }
          & "$extracted/lupe.exe" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lupe-${{ env.RELEASE_VERSION }}-windows-x86_64
          path: dist/lupe-${{ env.RELEASE_VERSION }}-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: validate
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: macos-universal-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'test/**') }}

      - name: Build
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DLupe_ENABLE_LTO=ON \
            -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE" \
            -DLupe_ENABLE_UNIT_TESTING=ON
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify and package
        run: |
          set -euo pipefail

          binary=build/bin/Release/lupe
          strip -x "$binary"
          codesign --force --sign - "$binary"
          codesign --verify --verbose "$binary"
          file "$binary"

          architectures="$(lipo -archs "$binary")"
          for architecture in arm64 x86_64; do
            if [[ " ${architectures} " != *" ${architecture} "* ]]; then
              echo "error: macOS release is missing ${architecture}" >&2
              exit 1
            fi
          done

          while read -r dependency; do
            case "$dependency" in
              /usr/lib/* | /System/Library/*) ;;
              *)
                echo "error: unexpected macOS dependency: $dependency" >&2
                exit 1
                ;;
            esac
          done < <(otool -L "$binary" |
            awk '/^[[:space:]]/ {print $1}')
          "$binary" --version

          archive="lupe-${RELEASE_VERSION}-macos-universal.tar.gz"
          mkdir -p dist package
          install -m 0755 "$binary" package/lupe
          install -m 0644 LICENSE package/LICENSE
          install -m 0644 THIRD_PARTY_LICENSES.md package/THIRD_PARTY_LICENSES.md
          tar -C package -czf "dist/${archive}" \
            lupe LICENSE THIRD_PARTY_LICENSES.md

          extracted="$(mktemp -d)"
          tar -C "$extracted" -xzf "dist/${archive}"
          test -f "$extracted/LICENSE"
          test -f "$extracted/THIRD_PARTY_LICENSES.md"
          "$extracted/lupe" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lupe-${{ env.RELEASE_VERSION }}-macos-universal
          path: dist/lupe-${{ env.RELEASE_VERSION }}-macos-universal.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux
      - windows
      - macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lupe-${{ env.RELEASE_VERSION }}-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail

          cd dist
          sha256sum lupe-* > SHA256SUMS

      - name: Generate Homebrew Formula
        run: |
          set -euo pipefail

          ruby packaging/homebrew/generate-formula.rb \
            "$GITHUB_REF_NAME" \
            dist/SHA256SUMS \
            dist/lupe.rb
          ruby -c dist/lupe.rb
          (
            cd dist
            sha256sum lupe.rb >> SHA256SUMS
            cat SHA256SUMS
          )

      - name: Upload Homebrew Formula artifact
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula-${{ env.RELEASE_VERSION }}
          path: dist/lupe.rb
          if-no-files-found: error
          overwrite: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view --repo "$GH_REPO" "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "error: release ${GITHUB_REF_NAME} already exists; refusing to replace its assets" >&2
            exit 1
          fi

          gh release create --repo "$GH_REPO" "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Lupe ${GITHUB_REF_NAME}"

  homebrew:
    name: Update Homebrew tap
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false

    steps:
      - name: Check publishing configuration
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required to update the Homebrew tap"
            exit 1
          fi

      - name: Download Formula artifact
        uses: actions/download-artifact@v8
        with:
          name: homebrew-formula-${{ env.RELEASE_VERSION }}
          path: formula

      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: mrzleo/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish Formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          current_formula=homebrew-tap/Formula/lupe.rb
          current_version=""
          if [[ -f "$current_formula" ]]; then
            current_version="$(
              sed -nE \
                's#.*releases/download/v([0-9]+\.[0-9]+\.[0-9]+)/.*#\1#p' \
                "$current_formula" |
                head -n 1
            )"
          fi
          if [[ -n "$current_version" ]] &&
             [[ "$(printf '%s\n%s\n' "$current_version" "$version" |
               sort -V | tail -n 1)" == "$current_version" ]] &&
             [[ "$current_version" != "$version" ]]; then
            echo "::notice::Tap already contains newer Lupe ${current_version}; skipping ${version}"
            exit 0
          fi

          mkdir -p homebrew-tap/Formula
          install -m 0644 formula/lupe.rb homebrew-tap/Formula/lupe.rb
          cd homebrew-tap

          git add Formula/lupe.rb
          if git diff --cached --quiet; then
            echo "Homebrew Formula is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update lupe to ${version}"
          git push
